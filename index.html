<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Booth</title>
<style>
  :root { --ink:#f4ecff; --muted:#b9a8d6; --pink:#ff2bd6; --cyan:#2be8ff; --bg:#07010f; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; touch-action:none; }
  #panel { position:fixed; left:16px; top:16px; width:min(340px, calc(100vw - 32px)); padding:20px 20px 14px; box-sizing:border-box;
    background:rgba(14,4,28,.82); border:1px solid rgba(255,43,214,.45); border-radius:18px; backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(255,43,214,.25), inset 0 0 30px rgba(43,232,255,.06); }
  h1 { margin:0; font-size:28px; letter-spacing:.14em; font-weight:900;
    background:linear-gradient(90deg,var(--pink),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:2px 0 14px; color:var(--muted); }
  #status { font-size:13px; color:var(--muted); margin-bottom:12px; min-height:19px; }
  #status b { color:var(--ink); }
  button { font:inherit; font-weight:700; cursor:pointer; border-radius:12px; border:0; padding:12px 14px; width:100%; margin-bottom:10px; color:#12001f;
    background:linear-gradient(90deg,var(--pink),#b45cff); box-shadow:0 0 18px rgba(255,43,214,.35); }
  button.alt { background:transparent; color:var(--ink); border:1px solid rgba(43,232,255,.5); box-shadow:none; }
  button.cyan { background:linear-gradient(90deg,var(--cyan),#5c8bff); box-shadow:0 0 18px rgba(43,232,255,.35); }
  button:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }
  .row { display:flex; gap:10px; } .row button { flex:1; }
  .toggle { display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); margin:2px 0 10px; cursor:pointer; }
  .toggle input { width:18px; height:18px; accent-color:var(--pink); }
  .hint { font-size:12.5px; color:var(--muted); margin:6px 0 8px; }
  .link { background:none; box-shadow:none; color:var(--muted); padding:4px; margin:0; font-weight:500; text-decoration:underline; }
  #show { position:fixed; left:16px; top:16px; width:auto; padding:10px 16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>NEON BOOTH</h1>
  <p class="sub">A VR DJ booth for your Spotify</p>
  <div id="status">Not connected</div>
  <button id="connect">Connect Spotify</button>
  <button id="demo" class="alt">Try demo mode (no Spotify)</button>
  <div class="row">
    <button id="vr" class="cyan" disabled>Enter VR</button>
    <button id="mr" class="cyan" disabled>Passthrough</button>
  </div>
  <label class="toggle"><input type="checkbox" id="mic"> Lights react to the sound in the room (uses the mic)</label>
  <p class="hint" id="hint"></p>
  <button id="hide" class="link">Hide this panel</button>
</div>
<button id="show" hidden>Menu</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
